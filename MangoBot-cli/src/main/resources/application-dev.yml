server:
  port: 8082

# http://localhost:8082/doc.html#
knife4j:
  enable: true

spring:
  datasource:
    url: jdbc:sqlite:/not/used # 占位，实际由 Configuration 覆盖
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      enabled: false  # 我们自己控制初始化

logging:
  level:
    io.github.mangomaner.mangobot: INFO

mangobot:
  claude:
    # claude 内置工具白名单（空格分隔）。默认也是 Skill，这里显式写出来是因为它是"技能能不能用"的总闸：
    # Skill 工具一旦不给，claude 会把技能广告整段从系统提示词里撤掉，所有 SKILL.md 都点不动。
    # 不给其它内置工具（Bash/Read/Write…）：bot 的出口是 MCP 工具，那些 schema 白烧 token。
    builtin-tools: Skill
